<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cocho Central">
<title>APP COCHO CENTRAL V5.8.6</title>
<link rel="manifest" href="./manifest.json?v=5.8.6">
<style>
:root{--g:#0f5132;--g2:#198754;--bg:#eef6ef;--card:#fff;--ink:#10291c;--mut:#66776d;--line:#d6e5d9;--r:#dc3545;--b:#0d6efd;--y:#ffc107;--dark:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--g),#052e1b);color:#fff;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.15)}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}h1{font-size:18px;margin:0}.sub{font-size:12px;opacity:.9}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{background:#fff;color:#123;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}.ok{background:#d1e7dd}.warn{background:#fff3cd}.err{background:#f8d7da}.blue{background:#cfe2ff}.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 8px;background:#e6f2e8;border-bottom:1px solid var(--line)}.tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;white-space:nowrap}.tab.active{background:var(--g);color:#fff}main{max-width:1100px;margin:0 auto;padding:10px}.notice{background:#d1e7dd;border:1px solid #badbcc;border-radius:12px;padding:10px;margin-bottom:10px;font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.col6{grid-column:span 6}.col4{grid-column:span 4}.col12{grid-column:span 12}@media(max-width:800px){.col6,.col4{grid-column:span 12}}label{display:block;font-size:12px;font-weight:800;margin:7px 0 3px;color:#244d35}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fff}button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;margin:4px 4px 4px 0}.btn{background:var(--g2);color:#fff}.btnb{background:var(--b);color:#fff}.btng{background:#6c757d;color:#fff}.btny{background:var(--y);color:#111}.btnr{background:var(--r);color:#fff}button:disabled{opacity:.55}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.kpi b{font-size:26px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #e8efe9;text-align:left;font-size:13px}th{background:#eef7ef;color:#17462b}.pre{background:#07120c;color:#d7ffe0;border-radius:12px;padding:12px;white-space:pre-wrap;overflow:auto;max-height:360px;font-family:Consolas,monospace;font-size:12px}.small{font-size:12px;color:var(--mut)}footer{text-align:center;font-size:12px;color:#63766a;padding:20px}.hide{display:none}
</style>
</head>
<body>
<header><div class="top"><div><h1>APP COCHO CENTRAL V5.8.6</h1><div class="sub">Modo Leve • Cloud Otimizado • Acesso Multi-Propriedade</div></div><div class="badges"><span id="netBadge" class="badge ok">Online</span><span id="cloudBadge" class="badge warn">Cloud não testado</span><span id="soundBadge" class="badge blue">Som ativo</span><span id="hourBadge" class="badge ok">Brasília</span></div></div></header>
<nav class="tabs" id="tabs"></nav>
<main>
<div id="sessionNotice" class="notice">Nenhuma fazenda ativa. Valide em Acesso / Sessão antes de operar.</div>
<section id="view"></section>
</main>
<footer id="footer">APP COCHO CENTRAL V5.8.6 — aguardando Cloud</footer>
<script>
(function(){
var VERSION='APP COCHO CENTRAL V5.8.6';
var EXPECTED='SCRIPT COCHO CLOUD V2.4.5';
var STORE_URL='cocho_cloud_url_v586';
var STORE_SESS='cocho_sessao_v586';
var cloudUrl=localStorage.getItem(STORE_URL)||'';
var sess=loadJSON(STORE_SESS)||null;
var cloudVersion='Cloud não confirmado';
var lastRet='Aguardando...';
var tabs=['Painel','Config Cloud','Acesso / Sessão','Fazendas','Gerar Acesso','Usuários','Produtos da Fazenda'];
var active='Painel';
var soundOn=true;
var sending={};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function loadJSON(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function saveJSON(k,o){localStorage.setItem(k,JSON.stringify(o))}
function qs(obj){var a=[]; for(var k in obj){ if(obj[k]!==undefined && obj[k]!==null) a.push(encodeURIComponent(k)+'='+encodeURIComponent(obj[k])); } return a.join('&')}
function genOp(mod){var lg=sess&&sess.login_usuario?sess.login_usuario:'anon';return 'OP-'+new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14)+'-'+lg.replace(/[^a-z0-9]/gi,'').slice(0,10)+'-'+mod+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
function beep(){if(!soundOn)return;try{var A=window.AudioContext||window.webkitAudioContext;var a=new A();var o=a.createOscillator();var g=a.createGain();o.frequency.value=650;g.gain.value=.12;o.connect(g);g.connect(a.destination);o.start();setTimeout(function(){o.stop();a.close()},80)}catch(e){}}
function renderTabs(){var html='';for(var i=0;i<tabs.length;i++){html+='<button class="tab '+(tabs[i]===active?'active':'')+'" onclick="App.go(\''+tabs[i]+'\')">'+tabs[i]+'</button>'} $('tabs').innerHTML=html}
function setRet(o){lastRet=typeof o==='string'?o:JSON.stringify(o,null,2);var el=$('ret'); if(el) el.textContent=lastRet}
function updateTop(){ $('netBadge').textContent=navigator.onLine?'Online':'Offline'; $('netBadge').className='badge '+(navigator.onLine?'ok':'err'); $('cloudBadge').textContent=cloudVersion.indexOf('V2.4.5')>=0?'Cloud OK':'Cloud não testado'; $('cloudBadge').className='badge '+(cloudVersion.indexOf('V2.4.5')>=0?'ok':'warn'); $('soundBadge').textContent=soundOn?'Som ativo':'Som desligado'; var d=new Date(); $('hourBadge').textContent='Brasília '+d.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}); if(sess){$('sessionNotice').textContent='Fazenda ativa: '+sess.nome_fazenda+' | '+sess.nome_usuario+' | '+sess.perfil_usuario; $('sessionNotice').style.display='block'}else{$('sessionNotice').textContent='Nenhuma fazenda ativa. Valide em Acesso / Sessão antes de operar.'} $('footer').textContent=VERSION+' — '+cloudVersion+' — Modo Leve e envio seguro'}
function callCloud(params, timeoutMs, lockKey, cb){
 if(!cloudUrl){setRet('URL do Cloud não configurada.'); return}
 if(lockKey && sending[lockKey]){setRet('Operação já em envio. Aguarde para evitar duplicidade.'); return}
 if(lockKey) sending[lockKey]=true;
 setRet('Aguardando...'); beep();
 var done=false; var t=setTimeout(function(){ if(done)return; done=true; if(lockKey) sending[lockKey]=false; setRet('TEMPO_EXCEDIDO\nO Apps Script não respondeu no tempo esperado. Verifique se a operação foi gravada antes de reenviar.'); }, timeoutMs||70000);
 var url=cloudUrl+(cloudUrl.indexOf('?')>=0?'&':'?')+qs(params)+'&_ts='+Date.now();
 fetch(url).then(function(r){return r.text()}).then(function(txt){ if(done)return; done=true; clearTimeout(t); if(lockKey) sending[lockKey]=false; var o; try{o=JSON.parse(txt)}catch(e){o={ok:false,erro:'JSON_INVALIDO',retorno:txt}}; setRet(o); if(cb)cb(o); }).catch(function(e){ if(done)return; done=true; clearTimeout(t); if(lockKey) sending[lockKey]=false; setRet(String(e)); });
}
function requireSess(){ if(!sess){setRet('Valide Acesso / Sessão primeiro.'); return false} return true }
function baseParams(action){return {action:action,CHAVE_FAZENDA:sess?sess.chave_fazenda:'',LOGIN_USUARIO:sess?sess.login_usuario:''}}
function cardRet(){return '<div class="card"><h3>Retorno</h3><pre id="ret" class="pre">'+esc(lastRet)+'</pre></div>'}
function input(id,label,val,type){return '<label>'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val||'')+'">'}
function select(id,label,opts,val){var h='<label>'+label+'</label><select id="'+id+'">';for(var i=0;i<opts.length;i++)h+='<option '+(opts[i]===val?'selected':'')+'>'+opts[i]+'</option>';return h+'</select>'}
function render(){renderTabs();updateTop();var h='';
 if(active==='Painel') h=viewPainel();
 else if(active==='Config Cloud') h=viewConfig();
 else if(active==='Acesso / Sessão') h=viewAcesso();
 else if(active==='Fazendas') h=viewFazendas();
 else if(active==='Gerar Acesso') h=viewGerarAcesso();
 else if(active==='Usuários') h=viewUsuarios();
 else if(active==='Produtos da Fazenda') h=viewProdutos();
 $('view').innerHTML=h; updateTop(); }
function viewPainel(){return '<div class="card"><h2>Status Geral — Modo Leve</h2><div class="grid"><div class="kpi col4"><b>'+(sess?1:0)+'</b><br>Sessão</div><div class="kpi col4"><b id="kprod">0</b><br>Produtos</div><div class="kpi col4"><b id="ktempo">-</b><br>Tempo Cloud</div></div><div class="row"><button class="btn" onclick="App.testCloud()">Testar Cloud</button><button class="btnb" onclick="App.go(\'Produtos da Fazenda\')">Testar Produtos</button><button class="btng" onclick="App.toggleSound()">Liga/Desliga Som</button></div></div>'+cardRet()}
function viewConfig(){return '<div class="card"><h2>Config Cloud — leitura real do Script</h2>'+input('cloudUrl','URL do Web App /exec',cloudUrl)+'<div class="row"><button class="btn" onclick="App.saveUrl()">Salvar URL</button><button class="btnb" onclick="App.testCloud()">Testar conexão</button><button class="btng" onclick="App.clearUrl()">Limpar</button></div><div class="notice">Esperado: '+EXPECTED+' — Modo Leve.</div></div>'+cardRet()}
function viewAcesso(){return '<div class="card"><h2>Acesso / Sessão da Fazenda</h2>'+input('a_chave','CHAVE_FAZENDA',sess?sess.chave_fazenda:'')+input('a_login','LOGIN_USUARIO',sess?sess.login_usuario:'')+input('a_pin','PIN_USUARIO','','password')+'<div class="row"><button class="btn" onclick="App.validar()">Validar Acesso</button><button class="btng" onclick="App.preencherTeste()">Preencher Teste</button><button class="btnr" onclick="App.sair()">Sair/Limpar Sessão</button></div></div>'+cardRet()}
function viewFazendas(){return '<div class="card"><h2>Fazendas — rota leve</h2><div class="row"><button class="btnb" onclick="App.listarFazendas()">Listar Fazendas</button></div><div id="tableBox"></div></div>'+cardRet()}
function viewGerarAcesso(){return '<div class="card"><h2>Gerador de Acesso por Propriedade</h2>'+input('g_fazenda','Nome da Fazenda / Propriedade','FAZENDA MODO LEVE TESTE')+input('g_prop','Proprietário','TESTE MODO LEVE')+input('g_mun','Município','IRITUIA')+input('g_uf','Estado','PA')+input('g_loginp','Login do Proprietário','teste.leve')+input('g_pinp','PIN do Proprietário','')+input('g_oper','Operador inicial','OPERADOR LEVE')+input('g_logino','Login do Operador','operador.leve')+input('g_pino','PIN do Operador','')+'<div class="row"><button class="btnb" onclick="App.gerarAcesso()">Gerar Acesso Completo</button><button class="btng" onclick="App.copyRet()">Copiar Cartão</button></div></div>'+cardRet()}
function viewUsuarios(){return '<div class="card"><h2>Usuários — rota leve</h2>'+input('u_chave','CHAVE_FAZENDA',sess?sess.chave_fazenda:'')+input('u_nome','Nome do Usuário','MARCELO')+input('u_login','Login','marcelo')+input('u_pin','PIN Usuário','')+select('u_perfil','Perfil',['FUNCIONARIO_CAMPO','PROPRIETARIO','GERENTE_FAZENDA','VISUALIZADOR'],'FUNCIONARIO_CAMPO')+'<div class="row"><button class="btn" onclick="App.criarUsuario()">Criar Usuário</button><button class="btnb" onclick="App.listarUsuarios(false)">Listar Usuários Ativos</button><button class="btng" onclick="App.listarUsuarios(true)">Listar Todos</button><button class="btny" onclick="App.verificarDupUsuarios()">Verificar Duplicidades</button><button class="btng" onclick="App.corrigirDupUsuarios()">Corrigir Duplicidades</button></div><div id="tableBox"></div></div>'+cardRet()}
function viewProdutos(){return '<div class="card"><h2>Produtos da Fazenda — Modo Leve</h2>'+input('p_nome','Nome do Produto','SAL MINERAL TESTE 01')+select('p_tipo','Tipo',['SAL_MINERAL','PROTEINADO','ENERGETICO','CONCENTRADO','OUTRO'],'SAL_MINERAL')+input('p_fab','Fabricante','')+input('p_un','Unidade padrão','SACO')+input('p_kg','Kg por unidade/saco','30','number')+input('p_min','Saldo mínimo kg','60','number')+'<div class="row"><button class="btn" onclick="App.criarProduto()">Criar Produto</button><button class="btnb" onclick="App.listarProdutos()">Listar Produtos</button></div><div id="tableBox"></div></div>'+cardRet()}
function table(rows,cols){var h='<table><thead><tr>';for(var i=0;i<cols.length;i++)h+='<th>'+cols[i][1]+'</th>';h+='</tr></thead><tbody>';for(var r=0;r<rows.length;r++){h+='<tr>';for(var c=0;c<cols.length;c++)h+='<td>'+esc(rows[r][cols[c][0]])+'</td>';h+='</tr>'}return h+'</tbody></table>'}
window.App={
 go:function(t){active=t;render()},
 toggleSound:function(){soundOn=!soundOn;updateTop();beep()},
 saveUrl:function(){cloudUrl=$('cloudUrl').value.trim();localStorage.setItem(STORE_URL,cloudUrl);setRet('URL salva.');updateTop()},
 clearUrl:function(){localStorage.removeItem(STORE_URL);cloudUrl='';setRet('URL limpa.');updateTop()},
 testCloud:function(){callCloud({action:'ping'},30000,'ping',function(o){if(o&&o.versao)cloudVersion=o.versao;updateTop()})},
 validar:function(){callCloud({action:'validarAcesso',CHAVE_FAZENDA:$('a_chave').value,LOGIN_USUARIO:$('a_login').value,PIN_USUARIO:$('a_pin').value},45000,'login',function(o){if(o&&o.ok){sess=o;saveJSON(STORE_SESS,sess);updateTop();render()}})},
 preencherTeste:function(){if($('a_chave'))$('a_chave').value='COCHO-FAZENDASTESTE02-KR63-2026'; if($('a_login'))$('a_login').value='marcelo'; if($('a_pin'))$('a_pin').value='5544'},
 sair:function(){sess=null;localStorage.removeItem(STORE_SESS);render();setRet('Sessão limpa.')},
 listarFazendas:function(){callCloud({action:'listarFazendasLeve'},45000,'fazendas',function(o){if(o&&o.fazendas){$('tableBox').innerHTML=table(o.fazendas,[['NOME_FAZENDA','Fazenda'],['PROPRIETARIO','Proprietário'],['CHAVE_FAZENDA','Chave'],['PIN_FAZENDA','PIN']])}})},
 gerarAcesso:function(){callCloud({action:'gerarAcessoPropriedade',NOME_FAZENDA:$('g_fazenda').value,PROPRIETARIO:$('g_prop').value,MUNICIPIO:$('g_mun').value,ESTADO:$('g_uf').value,LOGIN_PROPRIETARIO:$('g_loginp').value,PIN_PROPRIETARIO:$('g_pinp').value,OPERADOR_INICIAL:$('g_oper').value,LOGIN_OPERADOR:$('g_logino').value,PIN_OPERADOR:$('g_pino').value,ID_OPERACAO_CLIENTE:genOp('GERARACESSO')},90000,'gerarAcesso')},
 copyRet:function(){try{navigator.clipboard.writeText(lastRet);setRet('Retorno copiado.')}catch(e){setRet('Não foi possível copiar.') }},
 criarUsuario:function(){callCloud({action:'criarUsuarioLeve',CHAVE_FAZENDA:$('u_chave').value,NOME_USUARIO:$('u_nome').value,LOGIN_USUARIO:$('u_login').value,PIN_USUARIO:$('u_pin').value,PERFIL_USUARIO:$('u_perfil').value,ID_OPERACAO_CLIENTE:genOp('USUARIO')},60000,'criarUsuario')},
 listarUsuarios:function(todos){var chave=$('u_chave')?$('u_chave').value:(sess?sess.chave_fazenda:'');callCloud({action:'listarUsuariosLeve',CHAVE_FAZENDA:chave,TODOS:todos?'SIM':'NAO'},50000,'listarUsuarios',function(o){if(o&&o.usuarios){$('tableBox').innerHTML=table(o.usuarios,[['NOME_USUARIO','Nome'],['LOGIN_USUARIO','Login'],['PERFIL_USUARIO','Perfil'],['PIN','PIN'],['STATUS_USUARIO','Status']])}})},
 verificarDupUsuarios:function(){var chave=$('u_chave').value;callCloud({action:'verificarDuplicidadesUsuariosLeve',CHAVE_FAZENDA:chave},60000,'verDupUsuarios')},
 corrigirDupUsuarios:function(){var chave=$('u_chave').value;callCloud({action:'corrigirDuplicidadesUsuariosLeve',CHAVE_FAZENDA:chave},70000,'corrDupUsuarios')},
 criarProduto:function(){if(!requireSess())return;callCloud({action:'criarProdutoLeve',CHAVE_FAZENDA:sess.chave_fazenda,LOGIN_USUARIO:sess.login_usuario,NOME_PRODUTO:$('p_nome').value,TIPO_PRODUTO:$('p_tipo').value,FABRICANTE:$('p_fab').value,UNIDADE_PADRAO:$('p_un').value,KG_POR_UNIDADE:$('p_kg').value,SALDO_MINIMO_KG:$('p_min').value,ID_OPERACAO_CLIENTE:genOp('PRODUTO')},60000,'criarProduto')},
 listarProdutos:function(){if(!requireSess())return;callCloud({action:'listarProdutosLeve',CHAVE_FAZENDA:sess.chave_fazenda},45000,'listarProdutos',function(o){if(o&&o.produtos){$('tableBox').innerHTML=table(o.produtos,[['NOME_PRODUTO','Produto'],['TIPO_PRODUTO','Tipo'],['UNIDADE_PADRAO','Unidade'],['KG_POR_UNIDADE','Kg/Un'],['SALDO_MINIMO_KG','Mínimo'],['STATUS_PRODUTO','Status']])}})}
};
window.addEventListener('online',updateTop);window.addEventListener('offline',updateTop);setInterval(updateTop,1000);render();
})();
</script>
</body>
</html>
